name: Historical county business patterns sector panel
on:
  push:
    branches: [research/graduate-housing-labor-national-2026]
  pull_request:
    branches: [main]
    paths:
      - "research/graduate-retention/**"
      - ".github/workflows/graduate-cbp-historical.yml"
permissions:
  contents: read
jobs:
  cbp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy requests
      - run: python -u research/graduate-retention/cbp_history.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: national-graduate-cbp-employment-establishments
          path: research/graduate-retention/out/cbp_county_2008_2023.csv.gz
          if-no-files-found: ignore
