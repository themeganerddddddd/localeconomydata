name: Seattle paired city vs applicant permitting time
on:
  push:
    branches: [research/permits-gdp-panel-2026]
permissions: {contents: read}
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy requests
      - run: python research/permit-gdp/seattle_review_paired.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seattle-city-applicant-paired-review
          path: research/permit-gdp/out/seattle_paired_city_applicant_days.csv
          if-no-files-found: ignore
