name: Permit duration and county GDP data feasibility
on:
  push:
    branches:
      - research/permits-gdp-panel-2026
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install pandas numpy requests scipy statsmodels matplotlib
      - name: Run audit
        run: python research/permit-gdp/pilot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: permit-gdp-audit
          path: research/permit-gdp/out/
          if-no-files-found: ignore
