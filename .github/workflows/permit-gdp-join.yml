name: Link existing permit audit to BEA and QCEW
on:
  push:
    branches:
      - research/permits-gdp-panel-2026
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packages
        run: python -m pip install pandas numpy requests
      - name: Restore original municipal aggregates from source audit
        uses: actions/download-artifact@v4
        with:
          name: permits-gdp-qcew-extended
          run-id: 44247905794
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: research/permit-gdp/out/
      - name: Join actual local employment, establishments, GDP
        run: python research/permit-gdp/extended_join.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: permitting-expanded-multioutcome-panel
          path: research/permit-gdp/out/
          if-no-files-found: ignore
