name: Emerging Industry Clusters (LQ 2.0)
on:
  push:
    branches:
      - research/emerging-clusters-lq2-2026
  pull_request:
    branches:
      - main
    paths:
      - "research/emerging-clusters/**"
      - ".github/workflows/emerging-industry-clusters.yml"
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install science stack
        run: python -m pip install --disable-pip-version-check pandas numpy scikit-learn lightgbm requests openpyxl matplotlib
      - name: Run county-industry panel analysis
        run: python research/emerging-clusters/study.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emerging-clusters-lq2-results
          path: research/emerging-clusters/out/
          if-no-files-found: ignore
