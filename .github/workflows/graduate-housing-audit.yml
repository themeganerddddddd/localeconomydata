name: Graduate Housing County Sources Audit
on:
  push:
    branches:
      - research/graduate-housing-labor-national-2026
  pull_request:
    branches: [main]
    paths:
      - "research/graduate-retention/**"
      - ".github/workflows/graduate-housing-audit.yml"
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy requests
      - run: python research/graduate-retention/source_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graduate-housing-sources
          path: research/graduate-retention/out/
          if-no-files-found: ignore
