name: Education & genuine new firm births official sources
on:
  push:
    branches: [research/graduate-housing-labor-national-2026]
  pull_request:
    branches: [main]
    paths: ['research/business-formation/**','.github/workflows/business-birth-demography.yml']
permissions: {contents: read}
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas numpy requests openpyxl
      - run: python -u research/business-formation/education_firm_births.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usda-education-median-income-and-real-startup-counties
          path: research/business-formation/out/
          if-no-files-found: ignore
